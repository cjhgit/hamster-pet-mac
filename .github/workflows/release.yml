name: Build and release macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0），仅构建测试包；正式发布请推送 v 标签'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Verify native engine
        run: |
          mkdir -p .build/verification
          clang++ -std=c++17 -O2 scripts/verify-native.cpp \
            -framework CoreGraphics -framework CoreText -framework CoreFoundation \
            -o .build/verification/verify
          .build/verification/verify

      - name: Verify AppKit interactions and tray
        run: |
          bash scripts/snapshot-native.sh | tee .build/verification/appkit.log
          grep -F 'PASS: accessory app tray menu' .build/verification/appkit.log

      - name: Build universal app and packages
        run: bash scripts/package-release.sh "$RELEASE_VERSION"

      - name: Verify packaged app launches
        run: |
          mkdir -p .build/download-check
          ditto -x -k "dist/Hamster-Pet-$RELEASE_VERSION-universal.zip" .build/download-check
          app="$PWD/.build/download-check/Hamster Pet.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Hamster Pet" > .build/verification/launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hamster-Pet-${{ env.RELEASE_VERSION }}-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > .build/release-notes.md <<'EOF'
          ## 本次更新
          - 默认采用 Metal GPU 渲染矢量场景和夜间光照，保留 Core Graphics 自动回退。
          - 缓存静态网格和圆角模板，减少重复三角函数、坐标计算与节点排序，保持 30 FPS。
          - 窗口隐藏、最小化或完全被遮挡时停止动画和 GPU 提交，释放绘制表面；恢复时不追赶暂停时间。
          - 新增 GPU 图像对照、真实窗口 CPU 基准及 GPU／CPU 回退交互验证。

          本机 Apple M4 Pro、大尺寸窗口、1× 显示缩放、每项测量 8 秒：应用进程 CPU 浅色模式约 9.1% → 5.4%，深色模式约 9.7% → 6.0%，约降低四成。保持 30 FPS；数值随设备和场景变化，不含 WindowServer，也不代表整机功耗。

          ## 下载与安装
          - 支持 macOS 14 及以上，Apple 芯片与 Intel 通用。
          - 下载 DMG 后将 **Hamster Pet.app** 拖入 **Applications**；也可下载 ZIP 解压安装。
          - 应用常驻菜单栏，不显示 Dock 图标。支持顶部拖拽、置顶、窗口大小、水印和深色模式，设置自动保存。

          ## 首次打开
          当前版本为临时签名，尚未经过 Apple Developer ID 签名和公证。如果 macOS 阻止打开，请先尝试打开应用，再前往 **系统设置 → 隐私与安全性 → 仍要打开** 并确认。无需关闭系统安全保护。

          提供 SHA256SUMS 校验文件；产物已通过引擎、AppKit 交互、托盘、通用架构及启动检查。
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Hamster Pet $RELEASE_VERSION" \
            --notes-file .build/release-notes.md
